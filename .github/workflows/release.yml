name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: read
  id-token: write
  attestations: write
  artifact-metadata: write

jobs:
  build:
    uses: cash-track/.github/.github/workflows/build.yml@main
    with:
      image: cashtrack/mysql-backup
    secrets: inherit
  deploy:
    needs: build
    uses: cash-track/.github/.github/workflows/deploy.yml@main
    with:
      service: mysql-backup
    secrets: inherit
  deploy-crashers:
    needs: deploy
    uses: cash-track/.github/.github/workflows/deploy.yml@main
    with:
      service: mysql-backup-crashers
    secrets: inherit
